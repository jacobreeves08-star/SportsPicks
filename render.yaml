      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: PICK_REMINDER_HEARTBEAT_URL
        sync: false

  - type: cron
    name: sports-pickem-results-summary-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "*/10 * * * *"
    buildCommand: npm install && npm run build --workspace apps/api
