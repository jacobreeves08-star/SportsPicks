# Render Blueprint. Two persistent environments, each with its own
# database and secrets — staging auto-deploys on every merge to main;
# prod is promoted manually (redeploy latest main) once staging looks
# good. Dev is not here at all: it runs entirely locally via
# docker-compose (see README), with zero dependency on this file or on
# Render. See docs/environments.md for the full rationale.
services:
  - type: web
    name: sports-pickem-api-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build --workspace apps/api
    # Runs against the new build, with the new code's env, BEFORE any
    # traffic is shifted to it — and a non-zero exit aborts the deploy,
    # leaving the previous version serving. Nothing ran migrations here
    # before this, which is how the college quiz shipped to a database
    # with no `trivia_*` tables and returned a 500 to every visitor.
    # `npm run migrate` (compiled), NOT `db:migrate` (tsx): tsx is a
    # devDependency and this service builds with NODE_ENV=production, so
    # it isn't installed. See apps/api/scripts/copy-migrations.mjs for
    # why the .sql files have to be copied into dist for this to work.
    #
    # Only the two web services do this — the cron services share the
    # same database and would just race each other to no purpose.
    preDeployCommand: npm run migrate --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SPORTS_API_PROVIDER
        value: live
      - key: ESPN_API_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_CLIENT_URL
        sync: false
    previewsEnabled: true

  - type: cron
    name: sports-pickem-schedule-ingest-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "0 */4 * * *"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run schedule-ingest --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SPORTS_API_PROVIDER
        value: live
      - key: ESPN_API_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SCHEDULE_INGEST_HEARTBEAT_URL
        sync: false

  - type: cron
    name: sports-pickem-score-poll-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "*/5 * * * *"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run score-poll --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SPORTS_API_PROVIDER
        value: live
      - key: ESPN_API_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: HEARTBEAT_URL
        sync: false

  # Golf runs on its own cadence, deliberately slower than score-poll:
  # a leaderboard moves continuously over four days rather than
  # resolving at one instant, so there's no "final whistle" to catch
  # promptly — 15 minutes is well inside the resolution anyone reads a
  # golf leaderboard at, at a fraction of score-poll's request volume.
  # This one job does discovery, leaderboard polling, AND grading (see
  # jobs/golf-ingest.ts for why they aren't split the way the team
  # sports' schedule-ingest/score-poll are).
  - type: cron
    name: sports-pickem-golf-ingest-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "*/15 * * * *"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run golf-ingest --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SPORTS_API_PROVIDER
        value: live
      - key: ESPN_API_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOLF_INGEST_HEARTBEAT_URL
        sync: false

  # The college-quiz player pool (docs/college-trivia.md). WEEKLY, by
  # far the slowest cadence of any job here, because the thing it
  # tracks barely moves: a player's college never changes at all, and
  # the only volatility is roster churn, which resolves weekly at best.
  # The quiz is fully playable from a week-stale pool, so there is
  # nothing to gain from polling a free, undocumented API harder.
  # Monday 04:00 UTC — off the hour every other job here clusters on,
  # and after the NFL week has fully settled.
  - type: cron
    name: sports-pickem-nfl-athlete-ingest-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "0 4 * * 1"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run nfl-athlete-ingest --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SPORTS_API_PROVIDER
        value: live
      - key: ESPN_API_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NFL_ATHLETE_INGEST_HEARTBEAT_URL
        sync: false

  - type: cron
    name: sports-pickem-anonymize-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "0 3 * * *"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run anonymize-accounts --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: ANONYMIZATION_HEARTBEAT_URL
        sync: false

  - type: cron
    name: sports-pickem-pick-reminder-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "*/10 * * * *"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run pick-reminder --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SENTRY_DSN
