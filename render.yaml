    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: RESULTS_SUMMARY_HEARTBEAT_URL
        sync: false

  - type: cron
    name: sports-pickem-operator-digest-staging
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "0 13 * * *"
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run operator-digest --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-staging
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
      - key: OPERATOR_DIGEST_HEARTBEAT_URL
        sync: false

  - type: web
    name: sports-pickem-api-prod
    runtime: node
    plan: starter
    branch: main
    autoDeploy: false # manual promotion only, after verifying staging
    buildCommand: npm install && npm run build --workspace apps/api
    # See the staging service above for why this exists and why it's the
    # compiled runner. Prod is promoted manually, so this runs at promote
    # time — the same commit having already migrated staging successfully
    # is most of what promotion is verifying.
    preDeployCommand: npm run migrate --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sports-pickem-db-prod
          property: connectionString
      - key: SPORTS_API_PROVIDER
        value: live
      - key: ESPN_API_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_CLIENT_URL
        sync: false
    previewsEnabled: false

