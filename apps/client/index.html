<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      font-display: swap means real text never blocks on this — the
      system-font fallback in tokens.css's --font-sans/--font-display
      stacks renders immediately and swaps once the real face arrives,
      so a cold load on bad wifi (this app's own stated constraint)
      never shows blank text. Anton is the bold condensed display face
      used for headlines/nav/primary buttons (tokens.css's
      --font-display); Inter stays the body/UI face — dense standings
      tables and form fields need a normal-width, highly legible font,
      not the display face used for "WIN THE WATERCOOLER"-style copy.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&display=swap"
      rel="stylesheet"
    />
    <title>Sports Pick'em</title>

    <!--
      Link preview card. A shared quiz result is a link in someone
      else's text message, and a bare address is the least persuasive
      thing that link could be — Messages, WhatsApp, Slack and iMessage
      all fetch these tags and render a titled card instead.

      They live in this static HTML, not in a route component, on
      purpose: the crawlers that build those cards do not execute
      JavaScript, so tags injected at render time would never be seen.
      That also means these are the tags for EVERY route, which is why
      they describe the quiz — the one page in this app a stranger
      actually gets linked to (docs/college-trivia.md's sharing
      section). Every other route is behind a login.

      No og:image, on purpose and not for want of an asset: the card is
      meant to be a link with a line of copy, not a picture in someone's
      thread. `twitter:card` is `summary` for the same reason —
      `summary_large_image` is the one that wants a hero image. Don't
      add one back without asking.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sports Pick'em" />
    <meta property="og:title" content="Think you know where they went to college?" />
    <meta
      property="og:description"
      content="Five NFL players a day, five colleges each, one guess apiece. Everyone gets the same five — play free, no account needed."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Think you know where they went to college?" />
    <meta
      name="twitter:description"
      content="Five NFL players a day, five colleges each, one guess apiece. Everyone gets the same five — play free, no account needed."
    />
    <meta
      name="description"
      content="Daily college trivia and weekly pick'em leagues with your friends. Five NFL players a day — name the college each one went to."
    />
  </head>
  <body>
    <!--
      No screens exist yet (Epics 9-11 build them). This entry point exists
      only so the infrastructure built this epic (query client, router,
      server-clock provider) can be exercised by dev/e2e — see src/main.tsx.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
