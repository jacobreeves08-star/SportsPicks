name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Preview deploys (per PR) and auto-deploy on merge to main are handled
# natively by Render via its GitHub integration + render.yaml — not by
# this workflow. See docs/environments.md. This workflow only gates
# merges with lint/typecheck/test, matching the required status checks
# in CONTRIBUTING.md's branch protection config.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sports_pickem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sports_pickem_test
      SPORTS_API_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # Throwaway DB, freshly created per run by the postgres service
      # container above — migrated here, never against dev/staging/prod.
      - run: npm run db:migrate --workspace apps/api
      - run: npm run test --workspace apps/api
